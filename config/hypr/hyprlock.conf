# Kaze standalone Hyprlock configuration (Kanagawa dark minimalist aesthetic)
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(1f1f28)
}

label {
    monitor =
    text = $TIME
    color = rgb(dcd7ba)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(9cabca)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(7e9cd8)
    inner_color = rgb(2a2a37)
    font_color = rgb(dcd7ba)
    check_color = rgb(98bb6c)
    fail_color = rgb(e82424)
    fade_on_empty = false
    placeholder_text = Password...
    rounding = 0
    position = 0, -64
    halign = center
    valign = center
}
