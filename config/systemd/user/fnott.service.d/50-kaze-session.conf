[Unit]
PartOf=kaze-session.target
Requisite=kaze-session.target
After=kaze-session.target
StartLimitIntervalSec=30s
StartLimitBurst=5

[Service]
Slice=session.slice
Environment=GLIBC_TUNABLES=glibc.malloc.trim_threshold=65536
EnvironmentFile=%t/kaze/session.env
ExecStartPost=-/usr/bin/sh -c 'test -f "$XDG_RUNTIME_DIR/kaze/dnd.state" && exec /usr/bin/fnottctl pause'
Restart=on-failure
RestartSec=250ms
TimeoutStartSec=8s
TimeoutStopSec=5s
