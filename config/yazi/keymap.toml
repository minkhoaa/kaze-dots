# Kaze Yazi keybindings (compact Vim ergonomics + Foot/Wayland helpers)

[mgr]
prepend_keymap = [
    { on = "<C-h>", run = "hidden toggle", desc = "Toggle hidden files" },
    { on = "!", run = 'shell "$SHELL" --block', for = "unix", desc = "Open shell here" },
    { on = "T", run = 'shell "kaze-footclient -N -D \"$PWD\" >/dev/null 2>&1 &"', for = "unix", desc = "Open terminal window here" },
    { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to ~/.config" },
    { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to ~/Downloads" },
    { on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Go to ~/Pictures" },
    { on = [ "g", "v" ], run = "cd ~/Videos", desc = "Go to ~/Videos" },
    { on = [ "g", "P" ], run = "cd ~/Projects", desc = "Go to ~/Projects" },
]

[input]
prepend_keymap = [
    { on = "<Esc>", run = "close", desc = "Cancel input" },
]
