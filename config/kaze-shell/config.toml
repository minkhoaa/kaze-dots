# Kaze Shell default configuration (Omarchy 42px vertical left rail)
# Hot-reloaded automatically on save; syntax errors keep the active config running.

[layout]
preset = "omarchy"

[theme]
mode = "dark"
palette = "Kanagawa"

[bar]
enabled = true
position = "left"
island_mode = false
thickness = 42
length = 0
margin_edge = 8
margin_ends = 8
corner_radius = 0.0
border_width = 2.0
background_opacity = 0.94
exclusive = true
persistent_workspaces = 5
font = "JetBrainsMono Nerd Font"
end_slots = ["tray", "display", "net", "vol", "bat", "notifications", "cc"]

[island]
enabled = false
style = "floating"
corner_radius = 20.0
margin_top = 8
absorb_osd = true
absorb_notify = true
auto_collapse_ms = 4500

[osd]
enabled = true
position = "top_right"
width = 224
height = 48
offset_x = 12
offset_y = 12
timeout_ms = 1500

[notifications]
enabled = true
position = "top_right"
width = 340
offset_x = 12
offset_y = 12
gap = 8
max_visible = 4
history_limit = 50
default_timeout_ms = 5000
low_timeout_ms = 3500

[launcher]
enabled = true
width = 560
max_rows = 9
offset_y = 120

[display]
left_click_cmd = ["kaze-display", "--menu"]
right_click_cmd = ["kaze-display", "toggle-window-share"]

[wallpaper]
enabled = true
dynamic_palette = true
