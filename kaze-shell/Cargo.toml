[workspace]
resolver = "2"
members = [
    "crates/kaze-core",
    "crates/kaze-hypr",
    "crates/kaze-ipc",
    "crates/kaze-ui",
    "crates/kaze-ext-bar",
    "crates/kaze-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
bitflags = "2"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
libc = "0.2"
memmap2 = "0.9"
notify = { version = "8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

kaze-core = { path = "crates/kaze-core" }
kaze-hypr = { path = "crates/kaze-hypr" }
kaze-ipc = { path = "crates/kaze-ipc" }
kaze-ui = { path = "crates/kaze-ui" }
kaze-ext-bar = { path = "crates/kaze-ext-bar" }

# Keep variables inspectable in our crates; keep source locations in dependencies.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
