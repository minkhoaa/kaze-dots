[workspace]
resolver = "2"
members = [
    "crates/kaze-core",
    "crates/kaze-hypr",
    "crates/kaze-ipc",
    "crates/kaze-sys",
    "crates/kaze-ui",
    "crates/kaze-ext-bar",
    "crates/kaze-ext-dock",
    "crates/kaze-ext-switcher",
    "crates/kaze-ext-corners",
    "crates/kaze-ext-osd",
    "crates/kaze-ext-notify",
    "crates/kaze-ext-launcher",
    "crates/kaze-ext-island",
    "crates/kaze-ext-cc",
    "crates/kaze-ext-canvas",
    "crates/kaze-ext-tray",
    "crates/kaze-ext-wallpaper",
    "crates/kaze-ext-clipboard",
    "crates/kaze-ext-idle",
    "crates/kaze-ext-session",
    "crates/kaze-ext-polkit",
    "crates/kaze-ext-capture",
    "crates/kaze-lock",
    "crates/kaze-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
bitflags = "2"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
memmap2 = "0.9"
notify = { version = "8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "process"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = "0.25"
unicode-bidi = "0.3"
unicode-segmentation = "1"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = { version = "1", features = ["derive"] }

kaze-core = { path = "crates/kaze-core" }
kaze-hypr = { path = "crates/kaze-hypr" }
kaze-ipc = { path = "crates/kaze-ipc" }
kaze-sys = { path = "crates/kaze-sys" }
kaze-ui = { path = "crates/kaze-ui" }
kaze-ext-bar = { path = "crates/kaze-ext-bar" }
kaze-ext-dock = { path = "crates/kaze-ext-dock" }
kaze-ext-switcher = { path = "crates/kaze-ext-switcher" }
kaze-ext-corners = { path = "crates/kaze-ext-corners" }
kaze-ext-osd = { path = "crates/kaze-ext-osd" }
kaze-ext-notify = { path = "crates/kaze-ext-notify" }
kaze-ext-launcher = { path = "crates/kaze-ext-launcher" }
kaze-ext-island = { path = "crates/kaze-ext-island" }
kaze-ext-cc = { path = "crates/kaze-ext-cc" }
kaze-ext-canvas = { path = "crates/kaze-ext-canvas" }
kaze-ext-tray = { path = "crates/kaze-ext-tray" }
kaze-ext-wallpaper = { path = "crates/kaze-ext-wallpaper" }
kaze-ext-clipboard = { path = "crates/kaze-ext-clipboard" }
kaze-ext-idle = { path = "crates/kaze-ext-idle" }
kaze-ext-session = { path = "crates/kaze-ext-session" }
kaze-ext-polkit = { path = "crates/kaze-ext-polkit" }
kaze-ext-capture = { path = "crates/kaze-ext-capture" }
kaze-lock = { path = "crates/kaze-lock" }

# Keep variables inspectable in our crates; keep source locations in dependencies.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
