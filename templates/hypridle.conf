general {
    inhibit_sleep = 3
    lock_cmd = systemctl --user start kaze-lock.service
    before_sleep_cmd = kaze-session lock
    after_sleep_cmd = kaze-session wake-displays
    # These run only after hypridle receives the compositor's lock notification.
    on_lock_cmd = busctl --system --timeout=2s call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetLockedHint b true
    on_unlock_cmd = busctl --system --timeout=2s call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetLockedHint b false
}

listener {
    timeout = 300
    on-timeout = kaze-session lock
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = kaze-session wake-displays
}
